name: Build JARVIS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project & Compile APK
        run: |
          mkdir -p app/src/main/java/com/abhi/jarvis

          cat << 'EOF' > settings.gradle
          rootProject.name = "JARVIS"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.abhi.jarvis'
              compileSdk 33
              defaultConfig {
                  applicationId "com.abhi.jarvis"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application android:label="JARVIS" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".JarvisService" android:enabled="true" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/abhi/jarvis/MainActivity.java
          package com.abhi.jarvis;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.FrameLayout;

          public class MainActivity extends Activity {
              boolean isRunning = false;
              Button btn;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (Build.VERSION.SDK_INT >= 23) {
                      requestPermissions(new String[]{"android.permission.RECORD_AUDIO", "android.permission.CAMERA"}, 1);
                  }

                  FrameLayout layout = new FrameLayout(this);
                  layout.setBackgroundColor(Color.parseColor("#0B0F19"));
                  btn = new Button(this);
                  btn.setText("START JARVIS");
                  btn.setTextSize(20);
                  btn.setBackgroundColor(Color.parseColor("#00E5FF"));
                  btn.setTextColor(Color.BLACK);
                  FrameLayout.LayoutParams params = new FrameLayout.LayoutParams(650, 220, Gravity.CENTER);
                  layout.addView(btn, params);
                  setContentView(layout);

                  btn.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          Intent serviceIntent = new Intent(MainActivity.this, JarvisService.class);
                          if (!isRunning) {
                              isRunning = true;
                              btn.setText("STOP JARVIS");
                              btn.setBackgroundColor(Color.parseColor("#FF1744"));
                              if (Build.VERSION.SDK_INT >= 26) {
                                  startForegroundService(serviceIntent);
                              } else {
                                  startService(serviceIntent);
                              }
                          } else {
                              isRunning = false;
                              btn.setText("START JARVIS");
                              btn.setBackgroundColor(Color.parseColor("#00E5FF"));
                              stopService(serviceIntent);
                          }
                      }
                  });
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/abhi/jarvis/JarvisService.java
          package com.abhi.jarvis;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.Locale;

          public class JarvisService extends Service {
              SpeechRecognizer sr;
              TextToSpeech tts;
              Intent speechIntent;
              AudioManager audioManager;
              PowerManager.WakeLock wakeLock;
              boolean isJarvisActive = false;
              Handler mainHandler = new Handler(Looper.getMainLooper());
              String apiKey = "AIzaSyBvQDdLnJq9IQGjsVrtCD_4Pr4H8g149JU";

              @Override
              public void onCreate() {
                  super.onCreate();
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Jarvis::WakeLock");
                  wakeLock.acquire();

                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel("jarvis_ch", "JARVIS Background", NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class).createNotificationChannel(channel);
                      Notification notif = new Notification.Builder(this, "jarvis_ch")
                          .setContentTitle("JARVIS is Active")
                          .setContentText("Listening in background...")
                          .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                          .build();
                      startForeground(1, notif);
                  }

                  audioManager = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                  isJarvisActive = true;

                  tts = new TextToSpeech(getApplicationContext(), new TextToSpeech.OnInitListener() {
                      @Override
                      public void onInit(int status) {
                          if (status != TextToSpeech.ERROR) {
                              tts.setLanguage(new Locale("hi", "IN"));
                              speakHindi("Jarvis online hai boss, hukum kijiye.");
                          }
                      }
                  });

                  setupRecognizer();
              }

              private void setupRecognizer() {
                  sr = SpeechRecognizer.createSpeechRecognizer(this);
                  speechIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                  speechIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");

                  sr.setRecognitionListener(new RecognitionListener() {
                      @Override public void onReadyForSpeech(Bundle params) {}
                      @Override public void onBeginningOfSpeech() {}
                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onEndOfSpeech() {}
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                      @Override public void onError(int error) {
                          if (isJarvisActive) {
                              mainHandler.postDelayed(new Runnable() {
                                  @Override public void run() { startListeningSilently(); }
                              }, 900);
                          }
                      }
                      @Override public void onResults(Bundle results) {
                          ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                          if (matches != null && matches.size() > 0) {
                              processCommand(matches.get(0).toLowerCase());
                          } else {
                              startListeningSilently();
                          }
                      }
                  });
              }

              private void muteBeep() {
                  try {
                      audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_MUTE, 0);
                      audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.ADJUST_MUTE, 0);
                  } catch (Exception e) {}
              }

              private void unmuteBeep() {
                  try {
                      audioManager.adjustStreamVolume(AudioManager.STREAM_NOTIFICATION, AudioManager.ADJUST_UNMUTE, 0);
                      audioManager.adjustStreamVolume(AudioManager.STREAM_SYSTEM, AudioManager.STREAM_UNMUTE, 0);
                  } catch (Exception e) {}
              }

              private void startListeningSilently() {
                  if (isJarvisActive && sr != null) {
                      muteBeep();
                      sr.startListening(speechIntent);
                  }
              }

              private void speakHindi(final String text) {
                  mainHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          unmuteBeep();
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis");
                          int delay = Math.max(3500, Math.min(text.length() * 85, 9000));
                          mainHandler.postDelayed(new Runnable() {
                              @Override public void run() { startListeningSilently(); }
                          }, delay);
                      }
                  });
              }

              private void processCommand(final String cmd) {
                  try {
                      if (cmd.contains("torch on") || cmd.contains("लाइट जलाओ") || cmd.contains("टॉर्च ऑन") || cmd.contains("torch jalao")) {
                          CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                          cm.setTorchMode(cm.getCameraIdList()[0], true);
                          speakHindi("Boss, torch on kar di hai.");
                          return;
                      } else if (cmd.contains("torch off") || cmd.contains("लाइट बंद") || cmd.contains("टॉर्च बंद") || cmd.contains("torch band")) {
                          CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                          cm.setTorchMode(cm.getCameraIdList()[0], false);
                          speakHindi("Torch band kar di gayi hai.");
                          return;
                      } else if (cmd.contains("youtube") || cmd.contains("यूट्यूब")) {
                          Intent i = getPackageManager().getLaunchIntentForPackage("com.google.android.youtube");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          }
                          speakHindi("YouTube open kar raha hoon.");
                          return;
                      } else if (cmd.contains("whatsapp") || cmd.contains("व्हाट्सएप")) {
                          Intent i = getPackageManager().getLaunchIntentForPackage("com.whatsapp");
                          if (i != null) {
                              i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(i);
                          }
                          speakHindi("WhatsApp khol raha hoon.");
                          return;
                      }
                  } catch (Exception e) {}

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          try {
                              URL url = new URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey);
                              HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                              conn.setRequestMethod("POST");
                              conn.setRequestProperty("Content-Type", "application/json");
                              conn.setDoOutput(true);

                              String prompt = "Tum JARVIS ho, mere personal voice assistant. Chhote se chhote (sirf 1 ya 2 line mein) aur natural Hinglish/Hindi mein jawab do: " + cmd;
                              String jsonInput = "{\"contents\":[{\"parts\":[{\"text\":\"" + prompt.replace("\"", "\\\"") + "\"}]}]}";

                              OutputStream os = conn.getOutputStream();
                              os.write(jsonInput.getBytes("UTF-8"));
                              os.close();

                              BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream(), "UTF-8"));
                              StringBuilder response = new StringBuilder();
                              String line;
                              while ((line = br.readLine()) != null) response.append(line);
                              br.close();

                              JSONObject jsonObj = new JSONObject(response.toString());
                              final String reply = jsonObj.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text").replace("*", "").replace("\n", " ");

                              speakHindi(reply);
                          } catch (final Exception e) {
                              speakHindi("Network mein kuch dikkat hai boss.");
                          }
                      }
                  }).start();
              }

              @Override
              public void onDestroy() {
                  isJarvisActive = false;
                  unmuteBeep();
                  if (sr != null) sr.destroy();
                  if (tts != null) tts.shutdown();
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          gradle assembleDebug

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
